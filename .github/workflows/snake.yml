name: EVA snake

on:
  schedule:
    - cron: "0 */12 * * *"
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - uses: Platane/snk@v3
        with:
          github_user_name: ${{ github.repository_owner }}
          outputs: |
            dist/eva-snake.svg?palette=github-light&color_snake=#6b3fa0&color_dots=#ebedf0,#c9f7b8,#7ee860,#39ff14,#1fa800
            dist/eva-snake-dark.svg?palette=github-dark&color_snake=#ff6a00&color_dots=#1a0b26,#3d1a5e,#6b3fa0,#9b5de5,#39ff14

      - uses: crazy-max/ghaction-github-pages@v4
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
